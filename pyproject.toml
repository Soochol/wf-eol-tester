[project]
name = "wf-eol-tester"
version = "0.1.0"
description = "EOL force tester: original eol_tester sequence plus a PySide6 UI for progress and setting changes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "station-service-sdk>=2.0.0",
    "loguru>=0.7.0",
    "pyserial>=3.5",
    "pyserial-asyncio>=0.6",
    "pyyaml>=6.0",
    "PySide6>=6.6",
]

[project.scripts]
eol-ui = "eol_ui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
